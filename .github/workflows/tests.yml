name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Expose the checked-out library at the path-repo location
        working-directory: ${{ github.workspace }}
        run: |
          sudo mkdir -p /var/www/html
          sudo ln -sfn "$GITHUB_WORKSPACE" /var/www/html/framework-library

      - name: Composer install (resolves themeum/framework from the local path repo)
        run: composer install --no-interaction

      - name: Run php-scoper
        run: |
          mkdir -p libraries/themeum/framework
          [ -f libraries/themeum/framework/helpers.php ] || printf '<?php\n' > libraries/themeum/framework/helpers.php
          composer run scope

      - name: Verify scoped output exists
        run: test -f libraries/themeum/framework/Application.php

      - name: Verify prefixed namespace in scoped output
        run: |
          grep -rq 'namespace Themeum\\Framework' libraries/themeum/framework/Application.php
          grep -rq 'function Themeum\\Framework\\app' libraries/themeum/framework/Facade.php
          grep -q 'use Carbon\\Carbon as BaseCarbon' libraries/themeum/framework/Supports/Carbon.php
          ! grep -rq 'Themeum\\Carbon\\' libraries/themeum/framework/
